# Wheel Prophet — nginx site. Replace YOUR-DOMAIN before installing.
# The site check in the Squeekchain Genesis flow expects HTTPS, so run certbot after this.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;

    # the marker is in the HTML, so nothing special is needed for it here
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
}
